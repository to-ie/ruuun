<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ruuun! Badges</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5E9C}a:hover{color:#101C2E}
</style>
</helmet>
<div style="width: 390px; height: 1460px; box-sizing: border-box; background: #F7F9FC; color: #101C2E; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 18px 20px 14px; background: #FFFFFF; border-bottom: 1px solid #DDE4EE; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.2">Badges</h1>
<span style="font-weight: 800; font-size: 16px">40 of 141</span>
</div>
<div style="height: 10px; border-radius: 999px; background: #E3E9F2; overflow: hidden"><div style="width: 28%; height: 100%; background: #FF8C24; border-radius: 999px"></div></div>
<div role="tablist" aria-label="Badge groups" style="display: flex; gap: 8px; overflow-x: auto; margin: 4px -20px 0; padding: 0 20px 2px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
<button type="button" role="tab" aria-selected="{{ c.sel }}" onClick="{{ c.pick }}" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer; font: 700 15px 'Nunito', sans-serif; border: 2px solid #101C2E; color: {{ c.fg }}; background: {{ c.bg }}">{{ c.label }}</button>
</sc-for>
</div>
</header>

<main style="flex: 1 1 auto; padding: 20px; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 20px">{{ s.title }}</h2>
<span style="font-size: 14px; color: #4B5872; font-weight: 700">{{ s.count }}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ s.items }}" as="b" hint-placeholder-count="6">
<div style="border-radius: 18px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; border: {{ b.border }}; background: {{ b.bg }}">
<span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{ b.iconBg }}">
<sc-if value="{{ b.earned }}" hint-placeholder-val="{{ true }}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#101C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ s.icon }}"></path></svg>
</sc-if>
<sc-if value="{{ b.locked }}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B5872" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</sc-if>
</span>
<span style="font-weight: 800; font-size: 14px; line-height: 1.25">{{ b.name }}</span>
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 999px; background: {{ b.pillBg }}; color: #101C2E">{{ b.status }}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DDE4EE; padding: 8px 8px 14px">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; text-decoration: none; color: #4B5872; font-size: 13px; font-weight: 700">
<span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
<a href="Missions.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; text-decoration: none; color: #4B5872; font-size: 13px; font-weight: 700">
<span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg></span>Missions</a>
<a href="Badges.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; text-decoration: none; color: #101C2E; font-size: 13px; font-weight: 800">
<span style="width: 56px; height: 32px; border-radius: 999px; background: #49C6FF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="15" r="5"></circle><path d="M8.5 11 6 3h4l2 5 2-5h4l-2.5 8"></path></svg></span>Badges</a>
<a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; text-decoration: none; color: #4B5872; font-size: 13px; font-weight: 700">
<span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>History</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1460}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'all' };
}
renderVals() {
const catDefs = [['all', 'All'], ['days', 'Run days'], ['dist', 'Distance'], ['weeks', 'Weekly'], ['story', 'Story'], ['adv', 'Adventure'], ['season', 'Seasons'], ['secret', 'Secret']];
const cats = catDefs.map((c) => {
const on = this.state.cat === c[0];
return { label: c[1], sel: on ? 'true' : 'false', bg: on ? '#101C2E' : '#FFFFFF', fg: on ? '#F7F9FC' : '#101C2E', pick: () => this.setState({ cat: c[0] }) };
});
const mk = (tint) => (name, status) => {
const earned = status === 'Earned';
const secret = name === '???';
return {
name: name, status: status, earned: earned, locked: !earned,
border: earned ? '2px solid #101C2E' : '1px solid #DDE4EE',
bg: earned ? '#FFFFFF' : '#F0F3F8',
iconBg: earned ? tint : '#DDE4EE',
pillBg: earned ? '#C9F54A' : (secret ? '#E3E9F2' : '#FFE4CC')
};
};
const d = mk('#49C6FF');
const s = mk('#FF8C24');
const x = mk('#C9F54A');
const sections = [
{ id: 'days', title: 'Run days', count: '8 of 20', icon: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4', items: [
d('Third Time Lucky', 'Earned'), d('Lucky Seven', 'Earned'), d('Double Digits', 'Earned'),
d('The Dozen', 'Earned'), d('Fifteen Adventures', '12/15'), d('Running Rookie', '12/20')
] },
{ id: 'dist', title: 'Best single outing', count: '6 of 17', icon: 'M13 3 5 14h6l-1 7 8-11h-6z', items: [
s('Pocket Rocket', 'Earned'), s('Half-K Hero', 'Earned'), s('Six Hundred Superstar', 'Earned'),
s('Three Quarter Quest', '600/750 m'), s('Eight Hundred Explorer', '600/800 m'), s('Kilometre Kid', '600/1000 m')
] },
{ id: 'secret', title: 'Secret', count: '1 of 7', icon: 'm12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z', items: [
x('Family Trail', 'Earned'), x('???', 'Locked'), x('???', 'Locked'),
x('???', 'Locked'), x('???', 'Locked'), x('???', 'Locked')
] }
];
const pick = this.state.cat;
const shown = pick === 'all' ? sections : sections.filter((sec) => sec.id === pick);
return { cats, sections: shown };
}
}
</script>
</body>
</html>
