<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ruuun! Log a run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5E9C}a:hover{color:#101C2E}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #F7F9FC; color: #101C2E; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 8px; background: #FFFFFF; border-bottom: 1px solid #DDE4EE">
<a href="Home.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #101C2E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 24px">Log a run</h1>
</header>

<main style="flex: 1 1 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 800; font-size: 16px">When</span>
<button type="button" style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 14px; border: 2px solid #C5CFDD; background: #FFFFFF; font: 700 17px 'Nunito', sans-serif; color: #101C2E; cursor: pointer; text-align: left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<span style="flex: 1 1 auto">Today · Sun 1 Nov</span>
<span style="font-size: 14px; color: #0B5E9C; font-weight: 800">Change</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dist" style="font-weight: 800; font-size: 16px">How far did you go?</label>
<div style="display: flex; gap: 10px">
<input id="dist" type="text" inputmode="decimal" value="{{ dist }}" onChange="{{ setDist }}" placeholder="425" style="flex: 1 1 auto; min-width: 0; min-height: 64px; box-sizing: border-box; border-radius: 14px; border: 2px solid #101C2E; background: #FFFFFF; padding: 0 16px; font: 800 30px 'Baloo 2', 'Nunito', sans-serif; color: #101C2E">
<div role="group" aria-label="Unit" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E9EEF5; padding: 4px; border-radius: 14px; width: 120px">
<sc-for list="{{ units }}" as="u" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ u.pressed }}" onClick="{{ u.pick }}" style="border: 0; border-radius: 10px; cursor: pointer; font: 800 17px 'Nunito', sans-serif; color: #101C2E; background: {{ u.bg }}">{{ u.label }}</button>
</sc-for>
</div>
</div>
<span style="font-size: 14px; color: #4B5872">Your mission was 425 m. Enter what you actually did.</span>
</div>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-weight: 800; font-size: 16px; padding: 0; margin-bottom: 8px">How did it feel?</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ efforts }}" as="e" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ e.pressed }}" onClick="{{ e.pick }}" style="min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; cursor: pointer; font: 800 16px 'Nunito', sans-serif; color: #101C2E; border: {{ e.border }}; background: {{ e.bg }}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><path d="M9 9.5h.01M15 9.5h.01"></path><path d="{{ e.mouth }}"></path></svg>
{{ e.label }}</button>
</sc-for>
</div>
</fieldset>

<div style="height: 1px; background: #DDE4EE"></div>
<span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 20px; margin-bottom: -8px">Extras <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; color: #4B5872">(optional)</span></span>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-weight: 800; font-size: 16px; padding: 0; margin-bottom: 8px">Walk or jog?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ m.pressed }}" onClick="{{ m.pick }}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer; font: 700 15px 'Nunito', sans-serif; color: {{ m.fg }}; border: 2px solid #101C2E; background: {{ m.bg }}">{{ m.label }}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-weight: 800; font-size: 16px; padding: 0; margin-bottom: 8px">Tags</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ tags }}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}" style="min-height: 44px; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 999px; cursor: pointer; font: 700 15px 'Nunito', sans-serif; color: #101C2E; border: {{ t.border }}; background: {{ t.bg }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg>{{ t.label }}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; gap: 12px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 8px; width: 130px">
<label for="mins" style="font-weight: 800; font-size: 16px">Minutes</label>
<input id="mins" type="text" inputmode="numeric" placeholder="e.g. 10" style="min-height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #C5CFDD; background: #FFFFFF; padding: 0 14px; font: 600 17px 'Nunito', sans-serif; color: #101C2E; width: 100%">
</div>
<span style="font-size: 14px; color: #4B5872; padding-bottom: 6px; flex: 1 1 auto">Just for your notes. Never used for speed.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="note" style="font-weight: 800; font-size: 16px">A tiny memory</label>
<span style="font-size: 14px; color: #4B5872">{{ noteCount }}/140</span>
</div>
<textarea id="note" rows="2" maxlength="140" value="{{ note }}" onChange="{{ setNote }}" placeholder="What did you notice?" style="box-sizing: border-box; border-radius: 14px; border: 2px solid #C5CFDD; background: #FFFFFF; padding: 12px 14px; font: 600 16px 'Nunito', sans-serif; color: #101C2E; resize: none"></textarea>
</div>

</main>

<div style="padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #DDE4EE">
<a href="RunSaved.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; background: #FF8C24; color: #101C2E; font-weight: 800; font-size: 19px; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"></path></svg>
Save run</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { dist: '450', unit: 'm', effort: 'easy', mode: 'walkjog', tags: ['park', 'family'], note: 'Spotted a heron by the pond' };
}
renderVals() {
const s = this.state;
const units = [{ id: 'm', label: 'm' }, { id: 'km', label: 'km' }].map((u) => ({ ...u, pressed: s.unit === u.id ? 'true' : 'false', bg: s.unit === u.id ? '#FFFFFF' : 'transparent', pick: () => this.setState({ unit: u.id }) }));
const effortDefs = [
{ id: 'easy', label: 'Easy', mouth: 'M8.5 14.5c1.8 2 5.2 2 7 0', tint: '#E8FBC2' },
{ id: 'okay', label: 'Okay', mouth: 'M9 15h6', tint: '#E1F5FF' },
{ id: 'hard', label: 'Hard', mouth: 'M8.5 16c1.8-1.8 5.2-1.8 7 0', tint: '#FFE4CC' }
];
const efforts = effortDefs.map((e) => {
const on = s.effort === e.id;
return { ...e, pressed: on ? 'true' : 'false', border: on ? '3px solid #101C2E' : '2px solid #DDE4EE', bg: on ? e.tint : '#FFFFFF', pick: () => this.setState({ effort: e.id }) };
});
const modes = [{ id: 'walk', label: 'Walk' }, { id: 'walkjog', label: 'Walk + jog' }, { id: 'jog', label: 'Mostly jog' }].map((m) => {
const on = s.mode === m.id;
return { ...m, pressed: on ? 'true' : 'false', bg: on ? '#101C2E' : '#FFFFFF', fg: on ? '#F7F9FC' : '#101C2E', pick: () => this.setState({ mode: on ? null : m.id }) };
});
const tagDefs = [
{ id: 'park', label: 'Park' }, { id: 'family', label: 'Family' }, { id: 'route', label: 'New route' }, { id: 'nature', label: 'Nature' }
];
const tags = tagDefs.map((t) => {
const on = s.tags.indexOf(t.id) !== -1;
return { ...t, pressed: on ? 'true' : 'false', icon: on ? 'M5 12.5 10 17l9-10' : 'M12 5v14M5 12h14', border: on ? '2px solid #101C2E' : '2px solid #C5CFDD', bg: on ? '#C9F54A' : '#FFFFFF', pick: () => this.setState({ tags: on ? s.tags.filter((x) => x !== t.id) : s.tags.concat([t.id]) }) };
});
return {
dist: s.dist, setDist: (ev) => this.setState({ dist: ev.target.value }),
note: s.note, noteCount: (s.note || '').length, setNote: (ev) => this.setState({ note: ev.target.value.slice(0, 140) }),
units, efforts, modes, tags
};
}
}
</script>
</body>
</html>
