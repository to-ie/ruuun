<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ruuun! First-run setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5E9C}a:hover{color:#101C2E}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F7F9FC; color: #101C2E; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #FFFFFF; padding: 28px 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-bottom: 1px solid #DDE4EE">
<img src="/_blob/d8a5f6375902b74cdfc71bbbed27e540" alt="ruuun!" style="width: 210px; height: auto; display: block">
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.15; text-align: center">Let's set up your adventure</h1>
<p style="margin: 0; font-size: 15px; color: #4B5872; text-align: center">Takes about a minute. A grown-up can help.</p>
</div>

<main style="flex: 1 1 auto; padding: 20px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="nick" style="font-weight: 800; font-size: 16px">Nickname <span style="font-weight: 600; color: #4B5872">(optional)</span></label>
<input id="nick" type="text" placeholder="Runner" maxlength="20" style="min-height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #C5CFDD; background: #FFFFFF; padding: 0 16px; font: 600 17px 'Nunito', sans-serif; color: #101C2E">
</div>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-weight: 800; font-size: 16px; padding: 0; margin-bottom: 10px">Where are you starting?</legend>
<sc-for list="{{ plans }}" as="p" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 14px; min-height: 64px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; cursor: pointer; border: {{ p.border }}; background: {{ p.bg }}">
<input type="radio" name="plan" checked="{{ p.selected }}" onChange="{{ p.pick }}" style="width: 22px; height: 22px; accent-color: #101C2E; margin: 0">
<span style="flex: 1 1 auto; display: flex; flex-direction: column">
<span style="font-weight: 800; font-size: 17px">{{ p.name }}</span>
<span style="font-size: 14px; color: #4B5872">First mission {{ p.dist }}</span>
</span>
</label>
</sc-for>
</fieldset>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column">
<legend style="font-weight: 800; font-size: 16px; padding: 0; margin-bottom: 10px">Outings each week</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #E9EEF5; padding: 6px; border-radius: 16px">
<sc-for list="{{ weeks }}" as="w" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ w.pressed }}" onClick="{{ w.pick }}" style="min-height: 48px; border-radius: 12px; border: 0; cursor: pointer; font: 800 18px 'Nunito', sans-serif; color: #101C2E; background: {{ w.bg }}; box-shadow: {{ w.shadow }}">{{ w.n }}</button>
</sc-for>
</div>
<span style="font-size: 14px; color: #4B5872; margin-top: 8px">You can change this later in Settings.</span>
</fieldset>

<div style="background: #E6F7FF; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#101C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 22px; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.4">Walk breaks are encouraged and rest days are good. Stop and tell a trusted adult if you feel pain, dizziness or unwell.</p>
</div>

<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #FF8C24; color: #101C2E; font-weight: 800; font-size: 19px; text-decoration: none; margin-top: auto">Let's go!</a>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { plan: 'new', weekly: 2 };
}
renderVals() {
const defs = [
{ id: 'new', name: 'New to it', dist: '300 m' },
{ id: 'moving', name: 'Getting moving', dist: '500 m' },
{ id: 'jogging', name: 'Already jogging', dist: '800 m' }
];
const plans = defs.map((d) => {
const on = this.state.plan === d.id;
return { ...d, selected: on, border: on ? '2px solid #101C2E' : '2px solid #DDE4EE', bg: on ? '#FFF1E3' : '#FFFFFF', pick: () => this.setState({ plan: d.id }) };
});
const weeks = [1, 2, 3].map((n) => {
const on = this.state.weekly === n;
return { n: n, pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', shadow: on ? '0 1px 3px rgba(16,28,46,0.2)' : 'none', pick: () => this.setState({ weekly: n }) };
});
return { plans, weeks };
}
}
</script>
</body>
</html>
